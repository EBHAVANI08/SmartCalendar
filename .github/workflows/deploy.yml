name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Auto Deploy to Production
    steps:
      - name: Execute remote deployment commands over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment on VPS..."
            cd /var/www/smart-calendar
            
            echo "📥 Pulling latest changes from main..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps
            
            echo "🔄 Generating Prisma client..."
            npx prisma generate
            
            echo "🏗️ Building Next.js application..."
            npm run build
            
            echo "♻️ Reloading PM2 process..."
            pm2 reload smart-calendar || pm2 restart smart-calendar || pm2 start ecosystem.config.cjs
            
            echo "✅ Deployment completed successfully!"
