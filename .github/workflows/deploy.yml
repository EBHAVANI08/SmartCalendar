name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Auto Deploy to Production
    permissions:
      contents: read
    steps:
      - name: Execute remote deployment commands over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting automated deployment on VPS..."
            
            # Load environment & PATH for non-interactive SSH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            export NODE_OPTIONS="--max-old-space-size=2048"

            cd /var/www/smart-calendar
            
            echo "📥 Authenticating & pulling latest changes from main..."
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps
            
            echo "🔄 Generating Prisma client..."
            npx prisma generate
            
            echo "🏗️ Building Next.js application..."
            npm run build
            
            echo "♻️ Reloading PM2 process..."
            pm2 reload smart-calendar || pm2 restart smart-calendar || pm2 start ecosystem.config.cjs
            pm2 save || true
            
            echo "✅ Deployment completed successfully!"
