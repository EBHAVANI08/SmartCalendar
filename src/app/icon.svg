  <rect x="18" y="2" width="4" height="8" rx="2" fill="#FBBF24" />
  <rect x="42" y="2" width="4" height="8" rx="2" fill="#FBBF24" />

  <!-- Timetable Grid Cells / Matrix Dots -->
  <rect x="14" y="28" width="8" height="6" rx="2" fill="#60A5FA" />
  <rect x="28" y="28" width="8" height="6" rx="2" fill="#A78BFA" />
  <rect x="42" y="28" width="8" height="6" rx="2" fill="#34D399" />

  <rect x="14" y="38" width="8" height="6" rx="2" fill="#F472B6" />
  <rect x="28" y="38" width="8" height="6" rx="2" fill="#FBBF24" />
  <rect x="42" y="38" width="8" height="6" rx="2" fill="#38BDF8" />

  <rect x="14" y="48" width="8" height="6" rx="2" fill="#A78BFA" />
  <rect x="28" y="48" width="8" height="6" rx="2" fill="#34D399" />
  <rect x="42" y="48" width="8" height="6" rx="2" fill="#F472B6" />

  <!-- AI Sparkle Indicator (Top Right) -->
