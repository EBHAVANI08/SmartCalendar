<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8" />
      <stop offset="0.5" stop-color="#312E81" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" />
